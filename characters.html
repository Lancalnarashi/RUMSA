  <header class="site-header">
    <a class="brand" href="index.html">
      <span>
        <strong>RUMSA</strong>
        <small>Character Archive</small>
      </span>
    </a>

    <nav class="main-nav">
      <a href="index.html">世界觀首頁</a>

      <a href="stories.html">故事紀錄</a>
    </nav>

  <main>
    <section class="character-hero section-shell">
      <p class="eyebrow">RUMSA CHARACTER ARCHIVE</p>
      <h1>人物檔案</h1>

      <p>
        教授、研究者與學生在這座學術城中相遇，
        每一份檔案都保存著一條尚未結束的支線。
      </p>
    </section>

    <section class="section-shell">
      <div class="character-grid">

        <article class="character-card">
          <img src="images/ershan.jpg" alt="亞伯司祭・爾山">

          <div class="character-card-content">
            <p class="character-role">藥學院教授</p>
            <h2>亞伯司祭・爾山</h2>

            <p>
              冷靜、嚴格且極少容忍錯誤的藥學教授，
              被學生稱為「藥學守門員」。
            </p>

            <div class="character-tags">
              <span>藥學</span>
              <span>教授</span>
              <span>E9743</span>
            </div>

            <a class="button button-primary"
               href="character-ershan.html">
              查看完整檔案
            </a>
          </div>
        </article>

        <article class="character-card">
          <img src="images/bianzhong.jpg" alt="卞仲">

          <div class="character-card-content">
            <p class="character-role">藥學院教授</p>
            <h2>言爍清</h2>

            <p>
              陽光開朗的教授，
              跟爾山唯一黑一白的鐵面代表。
            </p>

            <div class="character-tags">
              <span>藥學系</span>
              <span>教授</span>
              <span>研究室</span>
            </div>

            <a class="button button-primary"
               href="character-bianzhong.html">
              查看完整檔案
            </a>
          </div>
        </article>

      </div>
    </section>

  <footer class="site-footer">
    <strong>RUMSA Character Archive</strong>
